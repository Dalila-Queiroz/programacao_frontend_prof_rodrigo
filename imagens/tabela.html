<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <h1>Tabela</h1>
    <table>
        <caption>Alunos</caption>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Nota</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Aluno A</td>
                    <td>9.0</td>
                </tr>
                <tr>
                    <td>Aluno B</td>
                    <td>4.5</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Quantidade de alunos: 2</td>
                </tr>
            </tfoot>
        </tr>
    </table>
</body>
</html>
